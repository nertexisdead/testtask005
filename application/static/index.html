<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adrobot · Кампании</title>
  <link rel="stylesheet" href="/adminlte.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="/theme.css">
  <script defer src="/jquery-3.7.1.min.js"></script>
  <script defer src="/bootstrap.bundle.min.js"></script>
  <script defer src="/adminlte.min.js"></script>
  <script defer src="/app.js"></script>
</head>
<body class="dark-mode sidebar-mini">
  <div class="wrapper">
  <header class="main-header navbar navbar-dark app-navbar">
    <button type="button" class="btn btn-outline-light menu-toggle" data-widget="pushmenu" aria-controls="main-sidebar" aria-label="Переключить меню"><i class="fas fa-bars" aria-hidden="true"></i></button>
  </header>
  <aside id="main-sidebar" class="main-sidebar sidebar-dark-danger">
    <a class="brand-link wordmark" href="/campaigns" aria-label="Adrobot, кампании">
      <span class="brand-mark" aria-hidden="true"><i class="fas fa-robot"></i></span>
      <span class="brand-text">AD<strong>ROBOT</strong></span>
    </a>
    <nav class="sidebar pt-3" aria-label="Главное меню">
      <ul class="nav nav-pills nav-sidebar flex-column">
        <li class="nav-item"><a id="nav-campaigns" class="nav-link" href="/campaigns" aria-label="Кампании"><i class="nav-icon fas fa-bullhorn" aria-hidden="true"></i><p>Кампании</p></a></li>
        <li class="nav-item"><a id="nav-offers" class="nav-link" href="/offers" aria-label="Офферы"><i class="nav-icon fas fa-tags" aria-hidden="true"></i><p>Офферы</p></a></li>
        <li class="nav-item"><a class="nav-link" href="/docs" aria-label="Документация API"><i class="nav-icon fas fa-code" aria-hidden="true"></i><p>Документация API</p></a></li>
      </ul>
    </nav>
  </aside>
  <main class="content-wrapper workspace">
    <section class="page-head">
      <div><a id="back" href="/campaigns" hidden>← Все кампании</a><h1 id="page-title">Кампании</h1></div>
      <a id="new" href="/campaigns/new" class="btn btn-accent" hidden>＋ Новая кампания</a>
    </section>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <section id="campaign-page" hidden>
        <div class="card">
          <div class="card-header campaign-card-header"><h2 class="card-title">Справочник кампаний</h2><span id="count"></span></div>
          <div class="table-responsive">
            <table class="table campaign-table mb-0">
              <thead><tr>
                <th scope="col">Название</th><th scope="col">Домен</th><th scope="col">Гео</th>
                <th scope="col">Группа</th><th scope="col">Источник</th><th scope="col">Действия</th>
              </tr></thead>
              <tbody id="campaign-list"></tbody>
            </table>
          </div>
        </div>
    </section>
    <section id="offers-page" hidden>
      <div class="card table-responsive">
        <table class="table mb-0">
          <thead><tr><th scope="col">ID</th><th scope="col">Название</th></tr></thead>
          <tbody id="catalog-rows"></tbody>
        </table>
      </div>
    </section>
    <section id="editor-page" hidden>
        <div class="card">
          <div class="card-header"><h2 id="editor-title" class="card-title">Новая кампания</h2></div>
          <form id="campaign-form" class="card-body">
            <div class="form-row">
              <label class="form-group col-sm-9">Название<input class="form-control" name="name" required maxlength="120" placeholder="Например, RO · Beauty"></label>
              <label class="form-group col-sm-3">Гео<input class="form-control geo" name="geo" required pattern="[A-Za-z]{2}" maxlength="2" placeholder="RO"></label>
            </div>
            <div class="form-row">
              <label class="form-group col-sm-4">Домен<input class="form-control" name="domain" value="example.org" required maxlength="120"></label>
              <label class="form-group col-sm-4">Группа<input class="form-control" name="group" value="Local" required maxlength="120"></label>
              <label class="form-group col-sm-4">Источник<input class="form-control" name="source" value="Local" required maxlength="120"></label>
            </div>
            <div id="initial-offer">
              <label for="offer">Первый оффер</label>
              <select id="offer" class="form-control" name="offer_id" required></select>
            </div>
            <div class="form-actions">
              <button id="save" type="submit" class="btn btn-accent">Создать кампанию</button>
              <button id="delete" type="button" class="btn btn-outline-danger" hidden>Удалить кампанию</button>
            </div>
          </form>
        </div>
        <section id="flows" class="card" hidden>
          <div class="card-header"><h2 class="card-title">Потоки</h2></div>
          <div class="card-body">
            <div class="geo-flow"><span>Фильтр по стране</span><strong id="routing"></strong></div>
            <h3 class="offer-title">Ротация офферов</h3>
            <div class="table-responsive"><table class="table">
              <thead><tr><th scope="col">Оффер</th><th scope="col">Доля</th><th scope="col"><span class="sr-only">Действие</span></th></tr></thead>
              <tbody id="offer-rows"></tbody>
            </table></div>
            <form id="offer-form" class="offer-form">
              <select id="add-offer" class="form-control" aria-label="Оффер для добавления" required></select>
              <button class="btn btn-accent" type="submit">Добавить</button>
            </form>
          </div>
        </section>
    </section>
  </main>
  </div>
</body>
</html>
